# Verify the engine on Java 21 for every push and pull request.
name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw verify
      - name: Report line coverage
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse('target/site/jacoco/jacoco.xml')
          lines = report.find("./counter[@type='LINE']")
          covered = int(lines.get('covered'))
          total = covered + int(lines.get('missed'))
          print(f"Line coverage: {covered}/{total} ({covered / total:.2%})")
          PY
