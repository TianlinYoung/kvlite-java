# Verify the engine on Java 21 for every push and pull request.
name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - if: runner.os == 'Linux'
        run: ./mvnw verify
      - if: runner.os == 'Windows'
        run: .\mvnw.cmd verify
      - name: Report line coverage
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          report = ET.parse('target/site/jacoco/jacoco.xml')
          lines = report.find("./counter[@type='LINE']")
          covered = int(lines.get('covered'))
          total = covered + int(lines.get('missed'))
          print(f"Line coverage: {covered}/{total} ({covered / total:.2%})")
